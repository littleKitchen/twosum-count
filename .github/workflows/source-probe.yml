name: Probe Two Sum source from cloud runners

on:
  workflow_dispatch:
    inputs:
      provider:
        description: Cloud source reader to verify
        type: choice
        options: [system-chrome, tinyfish, websocket, curl-websocket]
        default: system-chrome
      platform:
        description: GitHub cloud platform
        type: choice
        options: [macos-15-intel, windows-latest, ubuntu-latest]
        default: macos-15-intel

permissions:
  contents: read

jobs:
  probe:
    runs-on: ${{ inputs.provider != 'system-chrome' && 'ubuntu-latest' || inputs.platform }}
    timeout-minutes: 8
    steps:
      - name: Check out the source reader
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Google Chrome
        if: inputs.provider == 'system-chrome'
        run: npx playwright install chrome
      - name: Install the standard curl WebSocket transport
        if: inputs.provider == 'curl-websocket'
        run: python3 -m pip install --disable-pip-version-check 'curl_cffi==0.16.3'
      - name: Probe a fresh counter frame with curl
        if: inputs.provider == 'curl-websocket'
        run: python3 scripts/probe-curl-websocket.py
      - name: Read a fresh online count without saving history
        if: inputs.provider != 'curl-websocket' && (runner.os != 'Linux' || inputs.provider != 'system-chrome')
        run: node scripts/probe-source.mjs
        env:
          COLLECT_BROWSER_HEADLESS: '0'
          COLLECT_BROWSER_CHANNEL: chrome
          COLLECT_BROWSER_SYSTEM: '1'
          COLLECT_BROWSER_WARMUP: '1'
          COLLECT_SOURCE_DIAGNOSTICS: '1'
          COLLECT_PROVIDER: ${{ inputs.provider }}
          TINYFISH_API_KEY: ${{ inputs.provider == 'tinyfish' && secrets.TINYFISH_API_KEY || '' }}
      - name: Read a fresh online count in Linux desktop
        if: runner.os == 'Linux' && inputs.provider == 'system-chrome'
        run: xvfb-run --auto-servernum node scripts/probe-source.mjs
        env:
          COLLECT_BROWSER_HEADLESS: '0'
          COLLECT_BROWSER_CHANNEL: chrome
          COLLECT_BROWSER_SYSTEM: '1'
          COLLECT_BROWSER_WARMUP: '1'
          COLLECT_SOURCE_DIAGNOSTICS: '1'
          COLLECT_PROVIDER: system-chrome
