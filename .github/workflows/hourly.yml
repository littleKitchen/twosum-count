name: Record Two Sum online count
on:
  workflow_dispatch:

concurrency:
  group: twosum-hourly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Collect a genuine sample
        run: npm run collect
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record hourly Two Sum online count"
            git push origin HEAD:main
          fi
