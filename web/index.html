<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Hourly online users on LeetCode Two Sum. A 30-day trend chart in Pacific Time.">
    <title>Two Sum Online Users</title>
    <link rel="stylesheet" href="./style.css?v=3">
    <script src="./chart.js?v=3" defer></script>
  </head>
  <body>
    <main>
      <h1>Two Sum online users</h1>
      <figure>
        <div class="chart-frame">
          <div id="y-axis" class="y-axis" aria-hidden="true"></div>
          <div id="chart-plot" class="chart-plot">
            <svg id="chart" height="360" role="img" aria-labelledby="chart-title chart-description">
              <title id="chart-title">Two Sum hourly online users</title>
              <desc id="chart-description">Loading hourly online counts.</desc>
            </svg>
            <output id="chart-tooltip" class="chart-tooltip" hidden></output>
          </div>
          <p id="empty-state" class="empty-state" role="status">Loading data…</p>
        </div>
        <figcaption id="caption">Last 30 days of hourly samples · Pacific Time (PT) · Missing samples are gaps.</figcaption>
      </figure>
      <noscript><p class="no-script">Enable JavaScript to view the online count chart.</p></noscript>
    </main>
  </body>
</html>
