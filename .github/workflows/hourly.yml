name: Record Two Sum online count
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

concurrency:
  group: twosum-hourly
  cancel-in-progress: false

permissions: {}

jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the verified source reader
        run: python -m pip install --disable-pip-version-check --requirement requirements.txt
      - run: npm test
      - name: Collect a genuine sample
        run: npm run collect
      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/data/history.json
          if ! git diff --cached --quiet; then
            git commit -m "Record hourly Two Sum online count"
            git push origin HEAD:main
          fi
      # GITHUB_TOKEN pushes do not trigger the separate Pages workflow. Upload
      # this updated working tree so the same run publishes its saved sample.
      - name: Upload the updated static page
        uses: actions/upload-pages-artifact@v4
        with:
          path: web

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # Share the Pages workflow's group to prevent overlapping deployments.
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the updated graph to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
